    <title>StudyGuide Palestine | دليل الدراسة فلسطين</title>
    <script>
(function(){
  var KEY="sg-installed";
  function get(){try{return localStorage.getItem(KEY)==="1"}catch(e){return false}}
  function set(v){try{v?localStorage.setItem(KEY,"1"):localStorage.removeItem(KEY)}catch(e){}}
  function standalone(){
    try{
      return window.matchMedia("(display-mode: standalone)").matches||
             window.matchMedia("(display-mode: fullscreen)").matches||
             window.matchMedia("(display-mode: minimal-ui)").matches||
             window.navigator.standalone===true;
    }catch(e){return false}
  }
  /* هل الموقع مثبّت كتطبيق؟ (يعمل كتطبيق الآن، أو سبق تثبيته على هذا الجهاز) */
  window.__sgIsInstalled=function(){
    if(standalone()){set(true);return true}
    return get();
  };
  if(standalone())set(true);
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();window.__sgInstall=e;
    /* المتصفح يعرض التثبيت = التطبيق غير مثبّت (أو تم حذفه) */
    set(false);
  });
  window.addEventListener("appinstalled",function(){
    set(true);window.__sgInstall=null;
    try{window.dispatchEvent(new Event("sg-installed"))}catch(e){}
  });
  /* كروم: يكتشف التطبيق المثبّت حتى لو فُتح الموقع داخل المتصفح */
  try{
    if(navigator.getInstalledRelatedApps){
      navigator.getInstalledRelatedApps().then(function(a){
        if(a&&a.length){set(true);try{window.dispatchEvent(new Event("sg-installed"))}catch(e){}}
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
